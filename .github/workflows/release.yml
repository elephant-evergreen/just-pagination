name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: '2026.10.17'
          cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm package
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --draft --title "Just Pagination $TAG" --notes-file "release-notes/$TAG.md" artifacts/just-pagination-*.zip artifacts/just-pagination-*.zip.sha256
